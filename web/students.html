<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard учеников</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 30px;
        }

        h1 {
            color: #333;
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            font-size: 1.2em;
        }

        .content {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
            flex-wrap: wrap;
            align-items: center;
        }

        .search-box {
            flex: 1;
            min-width: 250px;
        }

        .search-box input {
            width: 100%;
            padding: 12px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1em;
            transition: all 0.3s;
        }

        .search-box input:focus {
            outline: none;
            border-color: #667eea;
        }

        .filter-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .filter-group label {
            font-weight: 600;
            color: #333;
        }

        .filter-group select {
            padding: 10px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1em;
            cursor: pointer;
            background: white;
        }

        .stats-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            border-radius: 12px;
            color: white;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .stat-card h3 {
            font-size: 2em;
            margin-bottom: 5px;
        }

        .stat-card p {
            opacity: 0.9;
            font-size: 1.1em;
        }

        .students-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        .students-table thead {
            background: #f5f7fa;
        }

        .students-table th {
            padding: 15px;
            text-align: left;
            font-weight: 600;
            color: #333;
            cursor: pointer;
            user-select: none;
            border-bottom: 2px solid #e0e0e0;
        }

        .students-table th:hover {
            background: #eef0f4;
        }

        .students-table th.sortable::after {
            content: ' ⇅';
            opacity: 0.3;
        }

        .students-table th.sort-asc::after {
            content: ' ↑';
            opacity: 1;
        }

        .students-table th.sort-desc::after {
            content: ' ↓';
            opacity: 1;
        }

        .students-table td {
            padding: 15px;
            border-bottom: 1px solid #e0e0e0;
        }

        .students-table tbody tr {
            cursor: pointer;
            transition: background 0.2s;
        }

        .students-table tbody tr:hover {
            background: #f9fafb;
        }

        .score-badge {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.9em;
        }

        .score-excellent {
            background: #d4edda;
            color: #155724;
        }

        .score-good {
            background: #d1ecf1;
            color: #0c5460;
        }

        .score-average {
            background: #fff3cd;
            color: #856404;
        }

        .score-poor {
            background: #f8d7da;
            color: #721c24;
        }

        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-top: 30px;
        }

        .pagination button {
            padding: 10px 20px;
            border: 2px solid #667eea;
            background: white;
            color: #667eea;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
            transition: all 0.3s;
        }

        .pagination button:hover:not(:disabled) {
            background: #667eea;
            color: white;
        }

        .pagination button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .pagination span {
            padding: 10px 15px;
            color: #333;
            font-weight: 600;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
            font-size: 1.2em;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
            border: 1px solid #f5c6cb;
        }

        .notes-count {
            background: #667eea;
            color: white;
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 0.85em;
            font-weight: 600;
        }

        .back-link {
            display: inline-block;
            padding: 10px 20px;
            background: #667eea;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            margin-bottom: 20px;
            transition: all 0.3s;
        }

        .back-link:hover {
            background: #764ba2;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <a href="index.html" class="back-link">← Назад к вопросам</a>
            <h1>Dashboard учеников</h1>
            <p class="subtitle">Отслеживание прогресса и результатов</p>
        </header>

        <div class="content">
            <!-- Статистика -->
            <div class="stats-cards">
                <div class="stat-card">
                    <h3 id="total-students">0</h3>
                    <p>Всего учеников</p>
                </div>
                <div class="stat-card">
                    <h3 id="total-attempts">0</h3>
                    <p>Всего попыток</p>
                </div>
                <div class="stat-card">
                    <h3 id="avg-score">0%</h3>
                    <p>Средний балл</p>
                </div>
                <div class="stat-card">
                    <h3 id="active-students">0</h3>
                    <p>Активных за неделю</p>
                </div>
            </div>

            <!-- Элементы управления -->
            <div class="controls">
                <div class="search-box">
                    <input type="text" id="search" placeholder="Поиск по имени или email...">
                </div>
                <div class="filter-group">
                    <label>Сортировка:</label>
                    <select id="sort-by">
                        <option value="last_activity">Последняя активность</option>
                        <option value="student_name">Имя</option>
                        <option value="avg_score">Средний балл</option>
                        <option value="quizzes_taken">Кол-во викторин</option>
                        <option value="total_attempts">Кол-во попыток</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label>Порядок:</label>
                    <select id="sort-order">
                        <option value="desc">По убыванию</option>
                        <option value="asc">По возрастанию</option>
                    </select>
                </div>
            </div>

            <!-- Таблица учеников -->
            <div id="loading" class="loading" style="display: none;">Загрузка...</div>
            <div id="error" class="error" style="display: none;"></div>

            <table class="students-table" id="students-table">
                <thead>
                    <tr>
                        <th class="sortable" data-field="student_name">Имя ученика</th>
                        <th class="sortable" data-field="student_email">Email</th>
                        <th class="sortable" data-field="quizzes_taken">Викторины</th>
                        <th class="sortable" data-field="total_attempts">Попытки</th>
                        <th class="sortable" data-field="completed_attempts">Завершено</th>
                        <th class="sortable" data-field="avg_score">Средний балл</th>
                        <th class="sortable" data-field="last_activity">Последняя активность</th>
                        <th>Заметки</th>
                    </tr>
                </thead>
                <tbody id="students-tbody">
                </tbody>
            </table>

            <!-- Пагинация -->
            <div class="pagination">
                <button id="prev-page">← Предыдущая</button>
                <span id="page-info">Страница 1</span>
                <button id="next-page">Следующая →</button>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:5001/api';
        let currentPage = 0;
        const pageSize = 20;
        let totalStudents = 0;
        let searchTimeout = null;

        // Загрузка учеников
        async function loadStudents() {
            const search = document.getElementById('search').value;
            const sortBy = document.getElementById('sort-by').value;
            const sortOrder = document.getElementById('sort-order').value;

            document.getElementById('loading').style.display = 'block';
            document.getElementById('error').style.display = 'none';
            document.getElementById('students-table').style.opacity = '0.5';

            try {
                const params = new URLSearchParams({
                    search,
                    sort_by: sortBy,
                    sort_order: sortOrder,
                    limit: pageSize,
                    offset: currentPage * pageSize
                });

                const response = await fetch(`${API_URL}/students?${params}`);
                const data = await response.json();

                if (data.success) {
                    totalStudents = data.total;
                    displayStudents(data.students);
                    updateStats(data.students);
                    updatePagination();
                } else {
                    throw new Error(data.error);
                }
            } catch (error) {
                document.getElementById('error').textContent = `Ошибка: ${error.message}`;
                document.getElementById('error').style.display = 'block';
            } finally {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('students-table').style.opacity = '1';
            }
        }

        // Отображение учеников в таблице
        function displayStudents(students) {
            const tbody = document.getElementById('students-tbody');
            tbody.innerHTML = '';

            if (students.length === 0) {
                tbody.innerHTML = '<tr><td colspan="8" style="text-align: center; padding: 40px;">Ученики не найдены</td></tr>';
                return;
            }

            students.forEach(student => {
                const row = document.createElement('tr');
                row.onclick = () => window.location.href = `student_profile.html?name=${encodeURIComponent(student.student_name)}`;

                const avgScore = student.avg_score ? student.avg_score.toFixed(1) : '0';
                const scoreClass = avgScore >= 90 ? 'score-excellent' :
                                 avgScore >= 75 ? 'score-good' :
                                 avgScore >= 50 ? 'score-average' : 'score-poor';

                const lastActivity = student.last_activity ?
                    new Date(student.last_activity).toLocaleDateString('ru-RU') :
                    'Нет данных';

                row.innerHTML = `
                    <td><strong>${student.student_name || 'Аноним'}</strong></td>
                    <td>${student.student_email || '-'}</td>
                    <td>${student.quizzes_taken || 0}</td>
                    <td>${student.total_attempts || 0}</td>
                    <td>${student.completed_attempts || 0}</td>
                    <td><span class="score-badge ${scoreClass}">${avgScore}%</span></td>
                    <td>${lastActivity}</td>
                    <td>${student.total_notes > 0 ? `<span class="notes-count">${student.total_notes}</span>` : '-'}</td>
                `;

                tbody.appendChild(row);
            });
        }

        // Обновление статистики
        function updateStats(students) {
            document.getElementById('total-students').textContent = totalStudents;

            const totalAttempts = students.reduce((sum, s) => sum + (s.total_attempts || 0), 0);
            document.getElementById('total-attempts').textContent = totalAttempts;

            const avgScore = students.length > 0 ?
                students.reduce((sum, s) => sum + (s.avg_score || 0), 0) / students.length : 0;
            document.getElementById('avg-score').textContent = avgScore.toFixed(1) + '%';

            const oneWeekAgo = new Date();
            oneWeekAgo.setDate(oneWeekAgo.getDate() - 7);
            const activeStudents = students.filter(s =>
                s.last_activity && new Date(s.last_activity) > oneWeekAgo
            ).length;
            document.getElementById('active-students').textContent = activeStudents;
        }

        // Обновление пагинации
        function updatePagination() {
            const totalPages = Math.ceil(totalStudents / pageSize);
            document.getElementById('page-info').textContent =
                `Страница ${currentPage + 1} из ${totalPages || 1} (всего: ${totalStudents})`;

            document.getElementById('prev-page').disabled = currentPage === 0;
            document.getElementById('next-page').disabled = (currentPage + 1) * pageSize >= totalStudents;
        }

        // События
        document.getElementById('search').addEventListener('input', () => {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => {
                currentPage = 0;
                loadStudents();
            }, 300);
        });

        document.getElementById('sort-by').addEventListener('change', () => {
            currentPage = 0;
            loadStudents();
        });

        document.getElementById('sort-order').addEventListener('change', () => {
            currentPage = 0;
            loadStudents();
        });

        document.getElementById('prev-page').addEventListener('click', () => {
            if (currentPage > 0) {
                currentPage--;
                loadStudents();
            }
        });

        document.getElementById('next-page').addEventListener('click', () => {
            if ((currentPage + 1) * pageSize < totalStudents) {
                currentPage++;
                loadStudents();
            }
        });

        // Сортировка по клику на заголовок
        document.querySelectorAll('.sortable').forEach(th => {
            th.addEventListener('click', () => {
                const field = th.dataset.field;
                const sortBy = document.getElementById('sort-by');
                const sortOrder = document.getElementById('sort-order');

                // Если уже сортируем по этому полю, меняем порядок
                if (sortBy.value === field) {
                    sortOrder.value = sortOrder.value === 'asc' ? 'desc' : 'asc';
                } else {
                    sortBy.value = field;
                    sortOrder.value = 'desc';
                }

                // Обновляем классы заголовков
                document.querySelectorAll('.sortable').forEach(t => {
                    t.classList.remove('sort-asc', 'sort-desc');
                });
                th.classList.add(sortOrder.value === 'asc' ? 'sort-asc' : 'sort-desc');

                currentPage = 0;
                loadStudents();
            });
        });

        // Инициализация
        loadStudents();
    </script>
</body>
</html>
