<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Профиль ученика</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 30px;
        }

        h1 {
            color: #333;
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        h2 {
            color: #333;
            font-size: 1.8em;
            margin-bottom: 20px;
            margin-top: 30px;
        }

        .subtitle {
            color: #666;
            font-size: 1.2em;
        }

        .content {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 20px;
        }

        .back-link {
            display: inline-block;
            padding: 10px 20px;
            background: #667eea;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            margin-bottom: 20px;
            transition: all 0.3s;
        }

        .back-link:hover {
            background: #764ba2;
            transform: translateY(-2px);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 25px;
            border-radius: 12px;
            color: white;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .stat-card h3 {
            font-size: 2.5em;
            margin-bottom: 8px;
        }

        .stat-card p {
            opacity: 0.9;
            font-size: 1.1em;
        }

        .attempts-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        .attempts-table thead {
            background: #f5f7fa;
        }

        .attempts-table th {
            padding: 15px;
            text-align: left;
            font-weight: 600;
            color: #333;
            border-bottom: 2px solid #e0e0e0;
        }

        .attempts-table td {
            padding: 15px;
            border-bottom: 1px solid #e0e0e0;
        }

        .attempts-table tbody tr {
            cursor: pointer;
            transition: background 0.2s;
        }

        .attempts-table tbody tr:hover {
            background: #f9fafb;
        }

        .score-badge {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.9em;
        }

        .score-excellent {
            background: #d4edda;
            color: #155724;
        }

        .score-good {
            background: #d1ecf1;
            color: #0c5460;
        }

        .score-average {
            background: #fff3cd;
            color: #856404;
        }

        .score-poor {
            background: #f8d7da;
            color: #721c24;
        }

        .status-badge {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.85em;
        }

        .status-completed {
            background: #d4edda;
            color: #155724;
        }

        .status-in-progress {
            background: #fff3cd;
            color: #856404;
        }

        .notes-section {
            margin-top: 20px;
            padding: 20px;
            background: #f9fafb;
            border-radius: 10px;
        }

        .note {
            background: white;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .note-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .note-meta {
            font-size: 0.9em;
            color: #666;
        }

        .note-actions {
            display: flex;
            gap: 10px;
        }

        .note-actions button {
            padding: 5px 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.9em;
        }

        .edit-btn {
            background: #667eea;
            color: white;
        }

        .delete-btn {
            background: #dc3545;
            color: white;
        }

        .note-text {
            color: #333;
            line-height: 1.6;
        }

        .note-type {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 0.8em;
            font-weight: 600;
            margin-right: 10px;
        }

        .note-type-general {
            background: #e0e0e0;
            color: #333;
        }

        .note-type-strength {
            background: #d4edda;
            color: #155724;
        }

        .note-type-weakness {
            background: #f8d7da;
            color: #721c24;
        }

        .note-type-recommendation {
            background: #d1ecf1;
            color: #0c5460;
        }

        .add-note-form {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .add-note-form textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-family: inherit;
            font-size: 1em;
            resize: vertical;
            min-height: 100px;
            margin-bottom: 15px;
        }

        .add-note-form select,
        .add-note-form input {
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            margin-right: 10px;
            margin-bottom: 10px;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
            font-weight: 600;
            transition: all 0.3s;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #764ba2;
        }

        .tags-section {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin: 15px 0;
        }

        .tag {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.9em;
            font-weight: 600;
            color: white;
        }

        .tag-blue {
            background: #667eea;
        }

        .tag-green {
            background: #28a745;
        }

        .tag-red {
            background: #dc3545;
        }

        .tag-yellow {
            background: #ffc107;
            color: #333;
        }

        .tag-remove {
            cursor: pointer;
            font-weight: bold;
            opacity: 0.7;
        }

        .tag-remove:hover {
            opacity: 1;
        }

        .add-tag-form {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-top: 10px;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
            font-size: 1.2em;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
            border: 1px solid #f5c6cb;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
        }

        .modal-content {
            background: white;
            margin: 10% auto;
            padding: 30px;
            border-radius: 15px;
            max-width: 600px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .close {
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
            color: #999;
        }

        .close:hover {
            color: #333;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <a href="students.html" class="back-link">← Назад к списку</a>
            <h1 id="student-name">Загрузка...</h1>
            <p class="subtitle" id="student-email"></p>
        </header>

        <div id="loading" class="loading">Загрузка профиля...</div>
        <div id="error" class="error" style="display: none;"></div>

        <div id="profile-content" style="display: none;">
            <!-- Статистика -->
            <div class="content">
                <h2>Общая статистика</h2>
                <div class="stats-grid">
                    <div class="stat-card">
                        <h3 id="stat-quizzes">0</h3>
                        <p>Викторин пройдено</p>
                    </div>
                    <div class="stat-card">
                        <h3 id="stat-attempts">0</h3>
                        <p>Всего попыток</p>
                    </div>
                    <div class="stat-card">
                        <h3 id="stat-completed">0</h3>
                        <p>Завершено</p>
                    </div>
                    <div class="stat-card">
                        <h3 id="stat-avg-score">0%</h3>
                        <p>Средний балл</p>
                    </div>
                </div>
            </div>

            <!-- Попытки -->
            <div class="content">
                <h2>История попыток</h2>
                <table class="attempts-table">
                    <thead>
                        <tr>
                            <th>Викторина</th>
                            <th>Дата</th>
                            <th>Статус</th>
                            <th>Балл</th>
                            <th>Правильных</th>
                            <th>Заметки</th>
                            <th>Теги</th>
                        </tr>
                    </thead>
                    <tbody id="attempts-tbody">
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Модальное окно для просмотра попытки -->
    <div id="attempt-modal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2 id="modal-title">Детали попытки</h2>
            <div id="modal-content">
                <!-- Теги -->
                <div class="tags-section" id="attempt-tags"></div>
                <div class="add-tag-form">
                    <input type="text" id="new-tag-name" placeholder="Название тега">
                    <select id="new-tag-color">
                        <option value="blue">Синий</option>
                        <option value="green">Зеленый</option>
                        <option value="red">Красный</option>
                        <option value="yellow">Желтый</option>
                    </select>
                    <button class="btn btn-primary" onclick="addTag()">Добавить тег</button>
                </div>

                <!-- Заметки -->
                <div class="notes-section">
                    <h3>Заметки преподавателя</h3>
                    <div class="add-note-form">
                        <textarea id="new-note-text" placeholder="Введите заметку..."></textarea>
                        <select id="new-note-type">
                            <option value="general">Общая заметка</option>
                            <option value="strength">Сильная сторона</option>
                            <option value="weakness">Требует внимания</option>
                            <option value="recommendation">Рекомендация</option>
                        </select>
                        <input type="text" id="teacher-name" placeholder="Ваше имя">
                        <label>
                            <input type="checkbox" id="is-private">
                            Приватная заметка
                        </label>
                        <button class="btn btn-primary" onclick="addNote()">Добавить заметку</button>
                    </div>
                    <div id="notes-list"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:5001/api';
        let currentAttemptId = null;
        let studentName = null;

        // Получение имени ученика из URL
        const urlParams = new URLSearchParams(window.location.search);
        studentName = urlParams.get('name');

        if (!studentName) {
            document.getElementById('error').textContent = 'Имя ученика не указано';
            document.getElementById('error').style.display = 'block';
            document.getElementById('loading').style.display = 'none';
        } else {
            loadStudentProfile();
        }

        // Загрузка профиля ученика
        async function loadStudentProfile() {
            try {
                const response = await fetch(`${API_URL}/students/${encodeURIComponent(studentName)}`);
                const data = await response.json();

                if (data.success) {
                    displayProfile(data.profile);
                } else {
                    throw new Error(data.error);
                }
            } catch (error) {
                document.getElementById('error').textContent = `Ошибка: ${error.message}`;
                document.getElementById('error').style.display = 'block';
            } finally {
                document.getElementById('loading').style.display = 'none';
            }
        }

        // Отображение профиля
        function displayProfile(profile) {
            document.getElementById('student-name').textContent = profile.student_name || 'Аноним';
            document.getElementById('student-email').textContent = profile.student_email || 'Email не указан';

            document.getElementById('stat-quizzes').textContent = profile.quizzes_taken || 0;
            document.getElementById('stat-attempts').textContent = profile.total_attempts || 0;
            document.getElementById('stat-completed').textContent = profile.completed_attempts || 0;
            document.getElementById('stat-avg-score').textContent = (profile.avg_score || 0).toFixed(1) + '%';

            displayAttempts(profile.attempts || []);

            document.getElementById('profile-content').style.display = 'block';
        }

        // Отображение попыток
        function displayAttempts(attempts) {
            const tbody = document.getElementById('attempts-tbody');
            tbody.innerHTML = '';

            if (attempts.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" style="text-align: center; padding: 40px;">Попытки не найдены</td></tr>';
                return;
            }

            attempts.forEach(attempt => {
                const row = document.createElement('tr');
                row.onclick = () => openAttemptModal(attempt);

                const score = attempt.score || 0;
                const scoreClass = score >= 90 ? 'score-excellent' :
                                 score >= 75 ? 'score-good' :
                                 score >= 50 ? 'score-average' : 'score-poor';

                const status = attempt.completed_at ? 'Завершено' : 'В процессе';
                const statusClass = attempt.completed_at ? 'status-completed' : 'status-in-progress';

                const startDate = new Date(attempt.started_at).toLocaleString('ru-RU');

                row.innerHTML = `
                    <td><strong>${attempt.quiz_title || 'Без названия'}</strong></td>
                    <td>${startDate}</td>
                    <td><span class="status-badge ${statusClass}">${status}</span></td>
                    <td><span class="score-badge ${scoreClass}">${score.toFixed(1)}%</span></td>
                    <td>${attempt.correct_answers || 0} / ${attempt.total_questions || 0}</td>
                    <td>${attempt.notes_count > 0 ? `<span style="color: #667eea; font-weight: 600;">${attempt.notes_count}</span>` : '-'}</td>
                    <td>${attempt.tags || '-'}</td>
                `;

                tbody.appendChild(row);
            });
        }

        // Открытие модального окна с деталями попытки
        async function openAttemptModal(attempt) {
            currentAttemptId = attempt.id;
            document.getElementById('modal-title').textContent = `${attempt.quiz_title || 'Без названия'}`;

            // Загружаем заметки и теги
            await loadNotes(attempt.id);
            await loadTags(attempt.id);

            document.getElementById('attempt-modal').style.display = 'block';
        }

        // Загрузка заметок
        async function loadNotes(attemptId) {
            try {
                const response = await fetch(`${API_URL}/attempts/${attemptId}/notes`);
                const data = await response.json();

                if (data.success) {
                    displayNotes(data.notes);
                }
            } catch (error) {
                console.error('Ошибка загрузки заметок:', error);
            }
        }

        // Отображение заметок
        function displayNotes(notes) {
            const notesList = document.getElementById('notes-list');
            notesList.innerHTML = '';

            if (notes.length === 0) {
                notesList.innerHTML = '<p style="color: #666; padding: 20px; text-align: center;">Заметок пока нет</p>';
                return;
            }

            notes.forEach(note => {
                const noteDiv = document.createElement('div');
                noteDiv.className = 'note';

                const createdDate = new Date(note.created_at).toLocaleString('ru-RU');

                noteDiv.innerHTML = `
                    <div class="note-header">
                        <div class="note-meta">
                            <span class="note-type note-type-${note.note_type}">${getNoteTypeLabel(note.note_type)}</span>
                            ${note.teacher_name || 'Аноним'} • ${createdDate}
                            ${note.is_private ? ' • 🔒 Приватная' : ''}
                        </div>
                        <div class="note-actions">
                            <button class="edit-btn" onclick="editNote(${note.id})">Редактировать</button>
                            <button class="delete-btn" onclick="deleteNote(${note.id})">Удалить</button>
                        </div>
                    </div>
                    <div class="note-text">${note.note_text}</div>
                `;

                notesList.appendChild(noteDiv);
            });
        }

        // Метки типов заметок
        function getNoteTypeLabel(type) {
            const labels = {
                general: 'Общая',
                strength: 'Сильная сторона',
                weakness: 'Требует внимания',
                recommendation: 'Рекомендация'
            };
            return labels[type] || type;
        }

        // Добавление заметки
        async function addNote() {
            const noteText = document.getElementById('new-note-text').value.trim();
            if (!noteText) {
                alert('Введите текст заметки');
                return;
            }

            try {
                const response = await fetch(`${API_URL}/attempts/${currentAttemptId}/notes`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        note_text: noteText,
                        note_type: document.getElementById('new-note-type').value,
                        teacher_name: document.getElementById('teacher-name').value,
                        is_private: document.getElementById('is-private').checked
                    })
                });

                const data = await response.json();
                if (data.success) {
                    document.getElementById('new-note-text').value = '';
                    await loadNotes(currentAttemptId);
                }
            } catch (error) {
                alert('Ошибка при добавлении заметки: ' + error.message);
            }
        }

        // Удаление заметки
        async function deleteNote(noteId) {
            if (!confirm('Удалить заметку?')) return;

            try {
                const response = await fetch(`${API_URL}/notes/${noteId}`, {method: 'DELETE'});
                const data = await response.json();

                if (data.success) {
                    await loadNotes(currentAttemptId);
                }
            } catch (error) {
                alert('Ошибка при удалении заметки: ' + error.message);
            }
        }

        // Загрузка тегов
        async function loadTags(attemptId) {
            try {
                const response = await fetch(`${API_URL}/attempts/${attemptId}/tags`);
                const data = await response.json();

                if (data.success) {
                    displayTags(data.tags);
                }
            } catch (error) {
                console.error('Ошибка загрузки тегов:', error);
            }
        }

        // Отображение тегов
        function displayTags(tags) {
            const tagsDiv = document.getElementById('attempt-tags');
            tagsDiv.innerHTML = '';

            if (tags.length === 0) {
                tagsDiv.innerHTML = '<p style="color: #666;">Теги не добавлены</p>';
                return;
            }

            tags.forEach(tag => {
                const tagSpan = document.createElement('span');
                tagSpan.className = `tag tag-${tag.tag_color}`;
                tagSpan.innerHTML = `
                    ${tag.tag_name}
                    <span class="tag-remove" onclick="deleteTag(${tag.id})">×</span>
                `;
                tagsDiv.appendChild(tagSpan);
            });
        }

        // Добавление тега
        async function addTag() {
            const tagName = document.getElementById('new-tag-name').value.trim();
            if (!tagName) {
                alert('Введите название тега');
                return;
            }

            try {
                const response = await fetch(`${API_URL}/attempts/${currentAttemptId}/tags`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        tag_name: tagName,
                        tag_color: document.getElementById('new-tag-color').value
                    })
                });

                const data = await response.json();
                if (data.success) {
                    document.getElementById('new-tag-name').value = '';
                    await loadTags(currentAttemptId);
                }
            } catch (error) {
                alert('Ошибка при добавлении тега: ' + error.message);
            }
        }

        // Удаление тега
        async function deleteTag(tagId) {
            try {
                const response = await fetch(`${API_URL}/attempt-tags/${tagId}`, {method: 'DELETE'});
                const data = await response.json();

                if (data.success) {
                    await loadTags(currentAttemptId);
                }
            } catch (error) {
                alert('Ошибка при удалении тега: ' + error.message);
            }
        }

        // Закрытие модального окна
        document.querySelector('.close').onclick = () => {
            document.getElementById('attempt-modal').style.display = 'none';
        };

        window.onclick = (event) => {
            const modal = document.getElementById('attempt-modal');
            if (event.target === modal) {
                modal.style.display = 'none';
            }
        };
    </script>
</body>
</html>
