<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Test Edit.js Loading</title>
</head>
<body>
    <h1>Тест загрузки edit.js</h1>
    <button onclick="testFunction()">Тест showEditModal</button>
    <div id="result"></div>

    <script>
        console.log('=== Test script started ===');

        function testFunction() {
            const result = document.getElementById('result');
            result.innerHTML = '';

            console.log('Testing window.showEditModal...');
            console.log('Type:', typeof window.showEditModal);
            console.log('Value:', window.showEditModal);
            console.log('Window keys containing "edit":', Object.keys(window).filter(k => k.toLowerCase().includes('edit')));

            if (typeof window.showEditModal === 'function') {
                result.innerHTML += '<p style="color: green;">✅ window.showEditModal определена!</p>';
            } else {
                result.innerHTML += '<p style="color: red;">❌ window.showEditModal НЕ определена!</p>';
            }

            // Проверяем все функции из edit.js
            const editFunctions = ['showEditModal', 'closeEditModal', 'renderEditForm', 'addOption', 'removeOption', 'saveQuestion', 'deleteQuestion', 'updateQuestionTypeFields'];

            editFunctions.forEach(fname => {
                const exists = typeof window[fname] === 'function';
                const color = exists ? 'green' : 'red';
                const icon = exists ? '✅' : '❌';
                result.innerHTML += `<p style="color: ${color};">${icon} ${fname}: ${typeof window[fname]}</p>`;
            });
        }

        window.addEventListener('load', () => {
            console.log('=== Window loaded ===');
            setTimeout(testFunction, 100);
        });
    </script>

    <script src="edit.js?v=test123"></script>

    <script>
        console.log('=== After edit.js ===');
        console.log('window.showEditModal type:', typeof window.showEditModal);
    </script>
</body>
</html>
