<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Прохождение викторины</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 20px;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #555;
        }

        input[type="text"], input[type="email"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            padding: 15px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.1em;
            font-weight: 600;
            transition: transform 0.2s;
        }

        button:hover {
            transform: scale(1.05);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .progress-bar {
            height: 30px;
            background: #e0e0e0;
            border-radius: 15px;
            overflow: hidden;
            margin-bottom: 20px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #4caf50, #81c784);
            transition: width 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
        }

        .question-text {
            font-size: 1.2em;
            line-height: 1.6;
            margin-bottom: 20px;
            color: #333;
        }

        .options {
            margin: 20px 0;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option {
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            background: white;
        }

        .option:hover {
            background: #f5f5f5;
            border-color: #667eea;
        }

        .option.selected {
            border-color: #667eea;
            background: #f0f4ff;
        }

        .result-card {
            text-align: center;
            padding: 40px;
        }

        .score {
            font-size: 5em;
            font-weight: bold;
            margin: 20px 0;
        }

        .score.good { color: #4caf50; }
        .score.medium { color: #ff9800; }
        .score.bad { color: #f44336; }

        .loading {
            text-align: center;
            padding: 60px;
            color: #666;
            font-size: 1.2em;
        }

        .error {
            color: #f44336;
            padding: 20px;
            background: #ffebee;
            border-radius: 8px;
            margin-top: 20px;
        }

        .quiz-info {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .quiz-info p {
            margin: 5px 0;
            color: #666;
        }

        .navigation-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .btn-secondary {
            background: #e0e0e0;
            color: #333;
        }

        .btn-secondary:hover {
            background: #d0d0d0;
        }

        /* Стили для изображений в вариантах ответа */
        .option-image {
            margin-top: 10px;
            text-align: center;
        }

        .option-image img {
            max-width: 100%;
            max-height: 200px;
            border-radius: 8px;
            border: 2px solid #e0e0e0;
        }

        .option.selected .option-image img {
            border-color: #667eea;
        }

        /* Стили для улучшенной навигации */
        .quiz-layout {
            display: flex;
            gap: 20px;
        }

        .questions-sidebar {
            min-width: 200px;
            max-width: 250px;
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            max-height: 70vh;
            overflow-y: auto;
        }

        .questions-sidebar h3 {
            font-size: 1em;
            margin-bottom: 15px;
            color: #333;
        }

        .question-nav-item {
            display: flex;
            align-items: center;
            padding: 10px;
            margin-bottom: 8px;
            background: white;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            border: 2px solid transparent;
        }

        .question-nav-item:hover {
            background: #e3f2fd;
            transform: translateX(3px);
        }

        .question-nav-item.active {
            border-color: #667eea;
            background: #f0f4ff;
        }

        .question-nav-item.answered {
            background: #e8f5e9;
        }

        .question-nav-item.answered::before {
            content: '✓';
            color: #4caf50;
            font-weight: bold;
            margin-right: 8px;
        }

        .question-content {
            flex: 1;
        }

        @media (max-width: 768px) {
            .quiz-layout {
                flex-direction: column;
            }

            .questions-sidebar {
                max-width: 100%;
                max-height: 150px;
            }

            .question-nav-item {
                display: inline-block;
                min-width: 45px;
                text-align: center;
                margin-right: 8px;
            }

            .question-nav-item span {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div id="app-container">
                <div class="loading">Загрузка викторины...</div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:5001/api';
        let quiz = null;
        let sessionId = null;
        let currentQuestionIndex = 0;
        let userAnswers = [];
        let startTime = null;
        let questionStartTime = null;
        let optionImages = {}; // Хранилище изображений для вариантов ответов

        // Получить код викторины из URL
        function getQuizCode() {
            const params = new URLSearchParams(window.location.search);
            return params.get('code');
        }

        // Инициализация
        async function init() {
            const code = getQuizCode();

            if (!code) {
                showError('Неверная ссылка. Код викторины не указан.');
                return;
            }

            await loadQuiz(code);
        }

        // Загрузить викторину
        async function loadQuiz(code) {
            try {
                const response = await fetch(`${API_URL}/quizzes/code/${code}`);
                const data = await response.json();

                if (data.success) {
                    quiz = data.quiz;
                    showStartScreen();
                } else {
                    showError('Викторина не найдена или недоступна.');
                }
            } catch (error) {
                console.error('Ошибка загрузки викторины:', error);
                showError('Ошибка загрузки викторины. Проверьте подключение к интернету.');
            }
        }

        // Показать экран начала
        function showStartScreen() {
            const container = document.getElementById('app-container');

            container.innerHTML = `
                <h1>🎯 ${quiz.title}</h1>
                ${quiz.description ? `<p class="subtitle">${quiz.description}</p>` : ''}

                <div class="quiz-info">
                    <p><strong>Количество вопросов:</strong> ${quiz.question_count}</p>
                    ${quiz.time_limit ? `<p><strong>Время на прохождение:</strong> ${quiz.time_limit} минут</p>` : ''}
                    <p><strong>Максимум попыток:</strong> ${quiz.max_attempts || 'Без ограничений'}</p>
                </div>

                <div class="form-group">
                    <label>Ваше имя:</label>
                    <input type="text" id="student-name" placeholder="Введите ваше имя">
                </div>

                <div class="form-group">
                    <label>Email (опционально):</label>
                    <input type="email" id="student-email" placeholder="your@email.com">
                </div>

                <button onclick="startQuiz()">▶️ Начать викторину</button>
            `;
        }

        // Начать прохождение
        async function startQuiz() {
            const studentName = document.getElementById('student-name').value.trim();

            if (!studentName) {
                alert('Пожалуйста, введите ваше имя');
                return;
            }

            const studentEmail = document.getElementById('student-email').value.trim();

            try {
                const response = await fetch(`${API_URL}/quizzes/${quiz.unique_code}/start`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        student_name: studentName,
                        student_email: studentEmail || null
                    })
                });

                const data = await response.json();

                if (data.success) {
                    sessionId = data.session_id;
                    userAnswers = new Array(quiz.questions.length).fill(null);
                    startTime = Date.now();
                    currentQuestionIndex = 0;
                    showQuestion();
                } else {
                    alert(`Ошибка: ${data.error}`);
                }
            } catch (error) {
                console.error('Ошибка начала викторины:', error);
                alert('Ошибка начала викторины');
            }
        }

        // Загрузить изображения для варианта ответа
        async function loadOptionImage(optionId) {
            if (optionImages[optionId]) {
                return optionImages[optionId];
            }

            try {
                const response = await fetch(`${API_URL}/options/${optionId}/images`);
                const data = await response.json();

                if (data.success && data.images && data.images.length > 0) {
                    optionImages[optionId] = data.images;
                    return data.images;
                }
            } catch (error) {
                console.error('Ошибка загрузки изображений варианта:', error);
            }

            return null;
        }

        // Показать вопрос
        async function showQuestion() {
            const question = quiz.questions[currentQuestionIndex];
            const progress = ((currentQuestionIndex + 1) / quiz.questions.length * 100).toFixed(0);
            const container = document.getElementById('app-container');

            questionStartTime = Date.now();

            // Загружаем изображения для всех вариантов ответа
            const optionsWithImages = [];
            if (question.options) {
                for (const opt of question.options) {
                    const images = await loadOptionImage(opt.id);
                    optionsWithImages.push({ ...opt, images });
                }
            }

            // Создаем сайдбар с навигацией
            const sidebar = `
                <div class="questions-sidebar">
                    <h3>📝 Вопросы</h3>
                    ${quiz.questions.map((q, index) => `
                        <div class="question-nav-item ${index === currentQuestionIndex ? 'active' : ''} ${userAnswers[index] ? 'answered' : ''}"
                             onclick="navigateToQuestion(${index})">
                            <span>${index + 1}. ${q.text.substring(0, 30)}${q.text.length > 30 ? '...' : ''}</span>
                        </div>
                    `).join('')}
                </div>
            `;

            container.innerHTML = `
                <div class="progress-bar">
                    <div class="progress-fill" style="width: ${progress}%">
                        ${currentQuestionIndex + 1} / ${quiz.questions.length}
                    </div>
                </div>

                <div class="quiz-layout">
                    ${sidebar}
                    <div class="question-content">
                        <div class="question-text">
                            <strong>Вопрос ${currentQuestionIndex + 1}:</strong><br>
                            ${question.text}
                        </div>

                ${question.options && question.options.length > 0 ? `
                    <div class="options">
                        ${optionsWithImages.map((opt, i) => `
                            <div class="option ${userAnswers[currentQuestionIndex] === opt.text ? 'selected' : ''}"
                                 onclick="selectAnswer('${opt.text.replace(/'/g, "\\'")}')">
                                <div>${String.fromCharCode(65 + i)}. ${opt.text}</div>
                                ${opt.images && opt.images.length > 0 ? `
                                    <div class="option-image">
                                        <img src="${API_URL}/images/${opt.images[0].file_path}"
                                             alt="Option image"
                                             onerror="this.style.display='none'">
                                    </div>
                                ` : ''}
                            </div>
                        `).join('')}
                    </div>
                ` : ''}

                ${question.type === 'text' || question.type === 'essay' ? `
                    <div class="form-group" style="margin: 20px 0;">
                        <label>Ваш ответ:</label>
                        <textarea id="text-answer"
                                  rows="${question.type === 'essay' ? '10' : '3'}"
                                  placeholder="Введите ваш ответ здесь..."
                                  style="width: 100%; padding: 12px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 1em;"
                                  oninput="handleTextAnswer(this.value)">${userAnswers[currentQuestionIndex] || ''}</textarea>
                    </div>
                ` : ''}

                        <div class="navigation-buttons">
                            ${currentQuestionIndex > 0 ? `
                                <button class="btn-secondary" onclick="previousQuestion()">← Назад</button>
                            ` : ''}
                            ${currentQuestionIndex < quiz.questions.length - 1 ? `
                                <button onclick="nextQuestion()" ${!userAnswers[currentQuestionIndex] ? 'disabled' : ''} id="next-btn">
                                    Далее →
                                </button>
                            ` : `
                                <button onclick="finishQuiz()" ${!userAnswers[currentQuestionIndex] ? 'disabled' : ''} id="next-btn">
                                    ✓ Завершить
                                </button>
                            `}
                        </div>
                    </div>
                </div>
            `;
        }

        // Навигация к конкретному вопросу
        function navigateToQuestion(index) {
            currentQuestionIndex = index;
            showQuestion();
        }

        // Обработка текстового ответа
        function handleTextAnswer(value) {
            userAnswers[currentQuestionIndex] = value.trim();

            // Активируем/деактивируем кнопку "Далее"
            const nextBtn = document.getElementById('next-btn');
            if (nextBtn) {
                nextBtn.disabled = !value.trim();
            }
        }

        // Выбрать ответ
        async function selectAnswer(answer) {
            const question = quiz.questions[currentQuestionIndex];
            userAnswers[currentQuestionIndex] = answer;

            // Вычисляем время на ответ
            const timeSpent = Math.floor((Date.now() - questionStartTime) / 1000);

            // Отправляем ответ на сервер
            try {
                await fetch(`${API_URL}/quizzes/session/${sessionId}/answer`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        question_id: question.id,
                        answer: answer,
                        time_spent: timeSpent
                    })
                });
            } catch (error) {
                console.error('Ошибка отправки ответа:', error);
            }

            // Обновляем отображение
            showQuestion();
        }

        // Следующий вопрос
        async function nextQuestion() {
            // Сохраняем текстовый ответ перед переходом
            const question = quiz.questions[currentQuestionIndex];
            if (question.type === 'text' || question.type === 'essay') {
                const answer = userAnswers[currentQuestionIndex];
                if (answer) {
                    const timeSpent = Math.floor((Date.now() - questionStartTime) / 1000);
                    try {
                        await fetch(`${API_URL}/quizzes/session/${sessionId}/answer`, {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify({
                                question_id: question.id,
                                answer: answer,
                                time_spent: timeSpent
                            })
                        });
                    } catch (error) {
                        console.error('Ошибка отправки ответа:', error);
                    }
                }
            }

            if (currentQuestionIndex < quiz.questions.length - 1) {
                currentQuestionIndex++;
                showQuestion();
            }
        }

        // Предыдущий вопрос
        function previousQuestion() {
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                showQuestion();
            }
        }

        // Завершить викторину
        async function finishQuiz() {
            if (!confirm('Вы уверены, что хотите завершить викторину? После этого вы не сможете изменить ответы.')) {
                return;
            }

            const container = document.getElementById('app-container');
            container.innerHTML = '<div class="loading">Проверка ответов...</div>';

            try {
                const response = await fetch(`${API_URL}/quizzes/session/${sessionId}/complete`, {
                    method: 'POST'
                });

                const data = await response.json();

                if (data.success) {
                    showResults(data.results);
                } else {
                    showError('Ошибка завершения викторины');
                }
            } catch (error) {
                console.error('Ошибка завершения викторины:', error);
                showError('Ошибка завершения викторины');
            }
        }

        // Показать результаты
        function showResults(results) {
            const container = document.getElementById('app-container');
            const scoreClass = results.score >= 70 ? 'good' : results.score >= 50 ? 'medium' : 'bad';
            const totalTime = Math.floor((Date.now() - startTime) / 1000 / 60);

            container.innerHTML = `
                <div class="result-card">
                    <h1>🎉 Викторина завершена!</h1>

                    <div class="score ${scoreClass}">${results.score.toFixed(0)}%</div>

                    <div class="quiz-info">
                        <p><strong>Правильных ответов:</strong> ${results.correct_answers} из ${results.total_questions}</p>
                        ${results.points_earned !== undefined ? `
                            <p><strong>Набрано баллов:</strong> ${results.points_earned.toFixed(1)} из ${results.points_total.toFixed(1)}</p>
                        ` : ''}
                        <p><strong>Время:</strong> ${totalTime} мин</p>
                        ${results.is_passed !== undefined ? `
                            <p><strong>Результат:</strong> ${results.is_passed ? '✅ Тест пройден' : '❌ Тест не пройден'}</p>
                        ` : ''}
                    </div>

                    <p style="color: #666; margin-top: 20px;">
                        Спасибо за прохождение викторины!
                    </p>
                </div>
            `;
        }

        // Показать ошибку
        function showError(message) {
            const container = document.getElementById('app-container');
            container.innerHTML = `
                <h1>❌ Ошибка</h1>
                <div class="error">${message}</div>
            `;
        }

        // Запуск при загрузке
        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
